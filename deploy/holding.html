<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>YouTrained</title>
<style>
  :root { --bg:#fff; --fg:#141418; --muted:#5c5c66; --accent:#ffc400; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121216; --fg:#f2f2f5; --muted:#a2a2ad; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:18px/1.5 -apple-system,"Segoe UI",Helvetica,Arial,sans-serif; padding:16px; box-sizing:border-box; }
  main { max-width:560px; }
  .brand { font-weight:800; font-size:26px; border-bottom:4px solid var(--accent); display:inline-block; margin-bottom:22px; }
  h1 { font-size:30px; line-height:1.2; margin:0 0 12px; }
  p { color:var(--muted); margin:0 0 10px; }
</style>
</head>
<body>
<main>
  <div class="brand">YouTrained</div>
  <h1>Is your music in a known AI training dataset?</h1>
  <p>A free check of your YouTube channel against the public research datasets used to train and evaluate music-generation models.</p>
  <p>Launching shortly.</p>
</main>
</body>
</html>
