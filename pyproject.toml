[project]
name = "youtrained"
version = "0.1.0"
description = "Is my music in a known AI training dataset? Pure ID lookup against public research dataset manifests."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pyarrow>=25.0.1",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
]

[project.scripts]
youtrained = "youtrained.cli:app"

[project.optional-dependencies]
pdf = [
    "weasyprint>=70.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/youtrained"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
