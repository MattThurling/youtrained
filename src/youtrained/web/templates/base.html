<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YouTrained{% endblock %}</title>
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site">
    <a class="brand" href="/">YouTrained</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site">
    <p>YouTrained v{{ version }}. Pure identifier lookup against public research dataset manifests. No audio is uploaded or analysed.</p>
  </footer>
</body>
</html>
